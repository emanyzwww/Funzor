name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 拉取完整历史与 tag: git-cliff 要按 tag 区间生成发布说明
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 解析 Git Tag 版本号
      - name: 解析版本号
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag 需要形如 v1.2.3, 实际为 ${{ github.ref_name }}"
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "版本号: $version"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json / Cargo.toml / package.json 三处版本同步为 tag 版本
      - name: 同步版本号
        shell: pwsh
        run: |
          $files = @("src-tauri/tauri.conf.json", "src-tauri/Cargo.toml", "package.json")
          foreach ($f in $files) {
            $content = Get-Content $f -Raw -Encoding utf8
            $content = $content -replace '"version"\s*:\s*"[^"]*"', ('"version": "' + $env:VERSION + '"')
            $content = $content -replace '(?m)^version\s*=\s*"[^"]*"', ('version = "' + $env:VERSION + '"')
            Set-Content -Path $f -Value $content -Encoding utf8 -NoNewline
          }
          Write-Host "版本已同步: $env:VERSION"

      # 打包 NSIS 安装器, 并按原命名规范复制到 artifacts
      - name: 打包 NSIS 安装器
        shell: pwsh
        run: |
          pnpm tauri build

          if ($LASTEXITCODE -ne 0) {
            throw "tauri build 失败"
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $installerName = "FunzorSetup-v$env:VERSION-x64.exe"
          $built = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -like '*setup*' } | Select-Object -First 1

          if (-not $built) {
            throw "找不到 NSIS 安装包"
          }

          Copy-Item $built.FullName "artifacts/$installerName"

          Write-Host "安装包生成成功: $installerName"

      # 生成更新清单 (latest.json 格式与原版一致, 前端检查更新无需改动)
      - name: 生成更新清单
        shell: pwsh
        run: |
          $installerName = "FunzorSetup-v$env:VERSION-x64.exe"
          $installerPath = "artifacts/$installerName"

          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()

          $manifest = [ordered]@{
            version = $env:VERSION
            url     = "https://github.com/${{ github.repository }}/releases/latest/download/$installerName"
            sha256  = $hash
            notes   = ""
          }

          $manifest | ConvertTo-Json | Out-File -FilePath artifacts/latest.json -Encoding utf8

          Write-Host (Get-Content artifacts/latest.json -Raw)

      # 生成发行说明: 按 Conventional Commits 分组, 输出到 RELEASE_NOTES.md
      - name: 生成发行说明
        id: cliff
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
        with:
          config: cliff.toml
          args: --latest --strip header

      # 合成发行说明: 版本标题 + 手写摘要 + 分组 + 贡献者
      - name: 合成发行说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          pwsh scripts/build-release-notes.ps1 `
            -Version $env:VERSION `
            -TagName "${{ github.ref_name }}" `
            -Repository $env:GITHUB_REPO `
            -NotesPath RELEASE_NOTES.md

      # 创建 GitHub Release
      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installerName = "FunzorSetup-v$env:VERSION-x64.exe"

          if (-not (Test-Path RELEASE_NOTES.md) -or (Get-Item RELEASE_NOTES.md).Length -eq 0) {
            Write-Host "未生成发行说明, 使用默认说明"
            "Funzor $env:VERSION" | Out-File RELEASE_NOTES.md -Encoding utf8
          }

          gh release create "${{ github.ref_name }}" `
            "artifacts/$installerName" `
            artifacts/latest.json `
            --title "Funzor $env:VERSION" `
            --notes-file RELEASE_NOTES.md

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 创建失败"
          }
