name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 拉取完整历史与 tag: 发版说明按 tag 区间生成
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 解析 Git Tag 版本号
      - name: 解析版本号
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag 需要形如 v1.2.3, 实际为 ${{ github.ref_name }}"
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "版本号: $version"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 以 tag 版本为准, 同步 package.json / tauri.conf.json / Cargo.toml / Cargo.lock
      - name: 同步版本号
        shell: pwsh
        run: pnpm sync:version $env:VERSION

      # 打包 NSIS 安装器, 按发布命名复制到 dist
      - name: 打包 NSIS 安装器
        shell: pwsh
        run: |
          pnpm tauri build

          if ($LASTEXITCODE -ne 0) {
            throw "tauri build 失败"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $installerName = "FunzorSetup-v$env:VERSION-x64.exe"
          $built = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -like '*setup*' } | Select-Object -First 1

          if (-not $built) {
            throw "找不到 NSIS 安装包"
          }

          Copy-Item $built.FullName "dist/$installerName"

          Write-Host "安装包生成成功: $installerName"

      # 生成更新清单 (latest.json 格式与前端检查更新逻辑保持一致)
      - name: 生成更新清单
        shell: pwsh
        run: |
          $installerName = "FunzorSetup-v$env:VERSION-x64.exe"
          $installerPath = "dist/$installerName"

          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()

          $manifest = [ordered]@{
            version = $env:VERSION
            url     = "https://github.com/${{ github.repository }}/releases/latest/download/$installerName"
            sha256  = $hash
            notes   = ""
          }

          $manifest | ConvertTo-Json | Out-File -FilePath dist/latest.json -Encoding utf8

          Write-Host (Get-Content dist/latest.json -Raw)

      # 生成发行说明: NEXT_RELEASE.md + 两个 tag 之间的提交, 输出到 dist/release-notes.md
      - name: 生成发行说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:notes --tag "${{ github.ref_name }}" --repo "${{ github.repository }}"

      # 创建 GitHub Release
      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installerName = "FunzorSetup-v$env:VERSION-x64.exe"

          gh release create "${{ github.ref_name }}" `
            "dist/$installerName" `
            dist/latest.json `
            --title "Funzor $env:VERSION" `
            --notes-file dist/release-notes.md

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 创建失败"
          }
