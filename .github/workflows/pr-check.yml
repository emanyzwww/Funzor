name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check design system
        shell: pwsh
        run: ./scripts/check-design-system.ps1 -RepoRoot . -Format Text

      - name: Check design reference
        shell: pwsh
        run: ./scripts/gen-design-reference.ps1 -RepoRoot . -Check

      - name: Build
        shell: pwsh
        run: dotnet build Funzor/Funzor.csproj -c Debug -p:Platform=x64 -nologo
